version: '3.8'

services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./apps/web/public:/usr/share/nginx/html:ro
    restart: always

  api:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - PORT=5000
      - PYTHON_SERVICE_URL=http://intelligence:8000
    ports:
      - "5000:5000"
    command: node apps/api/src/server.js
    depends_on:
      - intelligence
    restart: always

  intelligence:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: python services/intelligence/server.py 8000
    ports:
      - "8000:8000"
    restart: always
